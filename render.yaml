# Déploiement Render en un clic : Dashboard → New → Blueprint → ce dépôt.
# Crée la base PostgreSQL et le service web (site + API) ensemble.
databases:
  - name: soie-debene-db
    plan: free
    databaseName: boutique

services:
  - type: web
    name: soie-debene
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    # db:setup ne crée que ce qui manque : sans danger à chaque démarrage.
    startCommand: npm run db:setup && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: soie-debene-db
          property: connectionString
      # Clés de paiement : à remplir dans Render (Environment) quand tu les as.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NOTCHPAY_PUBLIC_KEY
        sync: false
      - key: NOTCHPAY_WEBHOOK_HASH
        sync: false
